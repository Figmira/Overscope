# Refreshes PUBLIC data (Blizzard news, public hero-rate tables, official image
# URLs), builds the Google-visible pages and publishes the site on GitHub Pages.
# No visitor data exists or is collected anywhere in this workflow.
#
# Security: every action is pinned to an exact commit (the comment shows the
# version), and each job only gets the permissions it needs.
name: Update public data & deploy

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions: {}               # nothing by default; jobs ask for what they need

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write         # commit the refreshed public data files
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Refresh public data
        run: node scripts/update-data.mjs
      - name: Check the site still works
        run: node --test tests/unit.test.mjs
      - name: Save data to the repository
        run: |
          git config user.name "overscope-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update public data"
            git push
          fi

  build:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}  # includes the data commit made above
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Build site (app + Google-visible pages + sitemap)
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write            # publish to GitHub Pages
      id-token: write         # proves the deploy came from this repository
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
